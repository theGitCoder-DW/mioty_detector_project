[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mioty-detector"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
[project.optional-dependencies]
test = ["pytest"]
cuda = ["cupy-cuda12x"]
[tool.setuptools.packages.find]
where = ["src"]
